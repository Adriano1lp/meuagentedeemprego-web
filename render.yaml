services:
  - type: web
    runtime: static
    name: meuagentedeemprego-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      - key: VITE_API_BASE_URL
        value: https://meu-agente-de-emprego.onrender.com
